# Research Red: the Art Kit's asset tracker AND gate (docs/ART_TRACKER.md is made from this).
#
# One [pieces."id"] per thing that will get new art. stage:
#   placeholder    the game uses a stand-in or early art; the new version isn't started
#   draft          the Art Kit made a version (tools, no hand work yet)
#   hand-finished  the owner (or an artist) finished it in Aseprite
#   approved       the owner's OK: it goes INTO THE GAME (art_gate.py apply)
# Only "approved" pieces are in the game; everything else stays drafts and previews.
# Exception: testing = true also puts a piece in for testing, without approving it
# (art_gate.py test ID on|off; off puts the original back. Owner 2026-10-30, #125).
# Owner, 2026-10-24: nothing is approved until the Art Kit is polished; the first
# pieces to go in are the Pallet Town ones (slice = "pallet", the vertical slice).
#
# Piece ids: ow:<recipe> (overworld sprite, recipes.toml), ow:players (both players +
# player.pal), battle:<cast> (trainer battle picture), back_pics (player + Ivy from
# behind), game:<name> (placed in the game with the old tools; tracked so the art
# pass can redo it). Change a stage: art_gate.py set ID STAGE ["note"].

