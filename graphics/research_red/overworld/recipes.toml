  { from = ["#000000"], to = "#24524e", rows = [16, 26], box = [8, 0, 16, 32], dirs = ["left"] },
]
patches = [
  { dir = "down", x = 5, y = 25, rows = ["bbbbbb", ".bbbb."], colours = { b = "#3a5cb0" } },
  # the cap: n navy, k black brim, y gold badge
  { dir = "down", x = 3, y = 9, rows = ["..kkkkkkkk..", ".knnnnnnnnk.", "knnnnyynnnnk", "knnnnnnnnnnk", "kkkkkkkkkkkk"], colours = { n = "#2c3c8c", k = "#101828", y = "#f0c838" } },
  { dir = "up", x = 3, y = 9, rows = ["..kkkkkkkk..", ".knnnnnnnnk.", "knnnnnnnnnnk", "knnnnnnnnnnk", "kkkkkkkkkkkk"], colours = { n = "#2c3c8c", k = "#101828" } },
  { dir = "left", x = 2, y = 9, rows = ["...kkkkkkkk..", "..knnnnnnnnk.", ".knnyynnnnnnk", ".knnnnnnnnnnk", "kkkkkkknnnnk."], colours = { n = "#2c3c8c", k = "#101828", y = "#f0c838" } },
