  { from = ["#000000", "#414152", "#8b8b94"], to = "#3cb8a8", rows = [0, 18], contrast = 0.75 },
  { from = ["#414152", "#8b8b94"], to = "#3cb8a8", rows = [18, 23], contrast = 0.75 },
  { from = ["#000000", "#414152", "#8b8b94"], to = "#3cb8a8", rows = [18, 29], contrast = 0.75, dirs = ["up"] },  # long hair down the back
  { from = ["#522041"], to = "#8ec6e8", rows = [23, 27] },                     # shirt -> light blue
  { from = ["#a44173", "#d573a4"], to = "#3a5cb0", rows = [18, 28] },          # uniform -> police blue
  { from = ["#414152", "#8b8b94"], to = "#283a78", rows = [23, 30], anchor = "#414152" },  # skirt -> navy
