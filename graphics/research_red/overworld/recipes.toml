# ------------------------------------------------------------------ the player (shares player.pal with the bike, surf and fishing sprites)
# player_warm.pal is player.pal warmed to the ref art (tan skin, auburn hair), 2026-10-24. With the art in the
# game (graphics/research_red/art_kit.toml) "install" copies it over player.pal, and the bike/surf/fishing sprites follow it.

[player_m]
notes = "Male player: auburn hair, OPEN lab coat over an olive shirt, jeans. Slim body: FireRed's Scientist with Professor Birch's head (Birch alone looked too heavy)."
base = "scientist"
head_from = "graphics/research_red/player_ow/src/prof_birch.png"
head_rows = 23
output = "graphics/research_red/player_ow/male_normal.png"
fit_palette = "graphics/research_red/overworld/player_warm.pal"
walk = "keep"
run = true
recolour = [
  { from = ["#cd624a"], to = "#d65c34", rows = [0, 23] },                      # hair light -> the palette's auburn
  { from = ["#943929"], to = "#c53939", rows = [0, 23] },                      # hair mid
  { from = ["#521000"], to = "#6a2929", rows = [0, 23] },                      # hair dark
  { from = ["#7b7341"], to = "#bd9c39", rows = [23, 27] },                     # shirt -> olive
  { from = ["#4a4a5a"], to = "#39397b", rows = [26, 32] },                     # trousers -> jeans
]
parts = [ { part = "open_coat_scientist", colours = { S = "#bd9c39", B = "#6a2929", P = "#4141d5", d = "#eeeeff", f = "#b4b4d5" } } ]

[player_f]
notes = "Female player: long auburn hair, lab coat, olive top, jeans. Base: FireRed's Lorelei (the long hair); her glasses are replaced by eyes."
base = "lorelei"
output = "graphics/research_red/player_ow/female_normal.png"
fit_palette = "graphics/research_red/overworld/player_warm.pal"
run = true
recolour = [
  { from = ["#e66a4a"], to = "#d65c34", rows = [0, 23] },                      # hair: exact palette reds, so it can't
  { from = ["#943929"], to = "#c53939", rows = [0, 23] },                      #   land on a skin colour
  { from = ["#521000"], to = "#6a2929", rows = [0, 23] },
  { from = ["#8b8b94"], to = "#eeeeff", rows = [23, 30] },                     # dress (light) -> white coat
  { from = ["#393918"], to = "#b4b4d5", rows = [23, 30] },                     # dress shade -> coat shade
  { from = ["#4a4a5a"], to = "#bd9c39", rows = [23, 27] },                     # top -> olive
  { from = ["#4a4a5a"], to = "#4141d5", rows = [27, 32] },                     # legs -> jeans
]
patches = [
  # eyes where the glasses were (s skin, k black)
  { dir = "down", x = 4, y = 19, rows = ["skssssks", "skssssks", ".ss..ss."], colours = { s = "#f0b480", k = "#000000" } },
  { dir = "left", x = 3, y = 19, rows = ["skss", "skss", ".sss"], colours = { s = "#f0b480", k = "#000000" } },
]

