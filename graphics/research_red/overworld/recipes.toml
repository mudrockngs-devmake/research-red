# Research Red overworld sprites, one recipe each.
# Build: python3 tools/research_red/art/ow_maker.py install   (help: ow_maker.py --help, docs/ART_TOOLS.md)
# Colours below were picked from the owner's reference art (E:\Workspace\romhacks\research-red\art\ref\).
# Base names: FireRed's graphics/object_events/pics/people/<name>.png, "em:" = Emerald (pret pokeemerald).
# People stand in rows 11-30 of their frame: hair ~11-16, face ~16-22, body ~23-27, legs ~28-30.

# ------------------------------------------------------------------ story cast

[elm]
notes = "Professor Elm: brown hair, glasses, OPEN lab coat over a teal shirt, olive trousers. FireRed's Scientist already has the glasses and coat."
base = "scientist"
gfx = "RR_ELM"
recolour = [
  { from = ["#393918", "#7b7341", "#cdac62"], to = "#9b6a3c", rows = [0, 23] },  # hair -> brown
  { from = ["#7b7341"], to = "#3f9a90", rows = [23, 27] },                     # tie / shirt -> teal
  { from = ["#4a4a5a"], to = "#7f8f4f", rows = [26, 32] },                     # trousers -> olive
]
parts = [ { part = "open_coat_scientist", colours = { S = "#41948b", B = "#4a3118", P = "#7b8352" } } ]

[ivy]
notes = "Ivy: purple hair to the shoulders (bigger than Anabel's), white lab coat, coral top, navy skirt, pink shoes. Emerald's Anabel has the hair shape and an already-white outfit."
base = "em:frontier_brains/anabel"
gfx = "RR_IVY"
ref = "05_ivy_labcoat"
walk = "make"
recolour = [
  { from = ["#a44173", "#522041", "#d573a4"], to = "#7a3a96", rows = [0, 23] },  # hair -> purple
  { from = ["#a44173", "#522041"], to = "#e0705f", rows = [23, 26] },          # top -> coral
  { from = ["#a44173", "#522041"], to = "#c8c8dc", rows = [26, 29] },          # lower top -> coat shade
  { from = ["#d5d5d5"], to = "#283a6a", rows = [26, 29] },                     # skirt -> navy
  { from = ["#394a62", "#6a8bac"], to = "#e05a8a", rows = [28, 32] },          # shoes -> pink
]
grow = [
  { colours = ["#7b3994", "#311841", "#ac6ac5"], outline = "#311841", fill = "#7b3994", rows = [11, 25] },  # more hair volume
]

[jenny]
notes = "Jenny (casual): long teal hair, blue jacket over a light blue top, navy skirt. Emerald's Lucy walks and has the long hair."
base = "em:frontier_brains/lucy"
gfx = "RR_JENNY"
ref = "07_jenny_casual"
palette = "jenny"
recolour = [
  { from = ["#000000", "#414152", "#8b8b94"], to = "#3cb8a8", rows = [0, 18], contrast = 0.75 },  # hair (incl. its dark) -> teal
  { from = ["#414152", "#8b8b94"], to = "#3cb8a8", rows = [18, 23], contrast = 0.75 },  # hair sides -> teal
  { from = ["#000000", "#414152", "#8b8b94"], to = "#3cb8a8", rows = [18, 29], contrast = 0.75, dirs = ["up"] },  # long hair down the back
  { from = ["#522041"], to = "#8ec6e8", rows = [23, 27] },                     # top -> light blue
  { from = ["#a44173", "#d573a4"], to = "#3a5cb0", rows = [18, 28] },          # jacket -> blue
  { from = ["#414152", "#8b8b94"], to = "#283a78", rows = [23, 30], anchor = "#414152" },  # skirt -> navy
  { from = ["#a44173", "#522041"], to = "#1e2648", rows = [28, 32] },          # shoes -> dark navy
  { from = ["#000000"], to = "#24524e", rows = [16, 28], box = [0, 0, 5, 32], dirs = ["down"] },   # hair beside the body: dark teal, not black
  { from = ["#000000"], to = "#24524e", rows = [16, 28], box = [11, 0, 16, 32], dirs = ["down"] },
  { from = ["#000000"], to = "#24524e", rows = [16, 26], box = [8, 0, 16, 32], dirs = ["left"] },
]
patches = [
  { dir = "down", x = 5, y = 25, rows = ["bbbbbb", ".bbbb."], colours = { b = "#8ec6e8" } },  # cover the midriff
]

[officer_jenny]
notes = "Officer Jenny (Viridian): Jenny's hair in the police uniform and cap."
